<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="main.css">
</head>

<body>
    <div class="head">
        <h1>Multi Looper</h1>
    </div>

    <hr>
    <div id="timeContainer">
        <div class="time">
            <input type="text" class="start_time hr" placeholder="00"> <span class="colon">:</span>
            <input type="text" class="start_time min" placeholder="00"> <span class="colon">:</span>
            <input type="text" class="start_time sec" placeholder="00"> 

            <input type="button" value="+" class="add_time_section">
            <input type="button" value="-"class="delete_time_section hide">

            <input type="text" class="end_time hr" placeholder="00"> <span class="colon">:</span>
            <input type="text" class="end_time min" placeholder="00"> <span class="colon">:</span>
            <input type="text" class="end_time sec" placeholder="00">

            <input type="button" value="&#10227" class="reset_time">
            
        </div>
    </div>

    
    <div class="func">
        <div class="status">
            <div class="statusLight notReady"></div><p>Status: Not Ready</p> <span class="videoLength" id="videoLength">0</span>
        </div>
        <input type="button" value="Start" id="startBtn" class="">
        <input type="button" value="Pause" id="pauseBtn" class="">
        <input type="button" value="Reset" id="resetBtn" class="">
        <input type="button" value="Re-Initialize" id="reInit" class="disabled hide">
    </div>

    <script defer src="timebox.js"></script>
    <script defer src="funcbox.js"></script>
</body>
</html>
